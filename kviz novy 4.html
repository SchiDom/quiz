<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Päť nápovedí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: jedna stĺpcová tabuľa, riadok = téma + 5 políčok; otázka sa otvorí na celú plochu. */
:root{
  --bg:#F1F3F9; --surface:#FFFFFF; --surface-2:#E6EAF4; --ink:#0F1630; --ink-2:#566080; --line:#CDD4E6;
  --accent:#2340D8; --on-accent:#FFFFFF; --gold:#FFC21A; --on-gold:#231800; --good:#0E7A4B; --bad:#B42318;
  --display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1021; --surface:#151B33; --surface-2:#1E2644; --ink:#EDF0FB; --ink-2:#9AA5C9; --line:#2C3659;
    --accent:#8EA6FF; --on-accent:#0A0F26; --gold:#FFC933; --on-gold:#231800; --good:#4ADE9A; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1021; --surface:#151B33; --surface-2:#1E2644; --ink:#EDF0FB; --ink-2:#9AA5C9; --line:#2C3659;
  --accent:#8EA6FF; --on-accent:#0A0F26; --gold:#FFC933; --on-gold:#231800; --good:#4ADE9A; --bad:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#app{max-width:980px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

h1,h2,.cat,.pts,.ps{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1}
h1{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(2rem,6vw,3rem);font-weight:900;margin:.1em 0 .2em;text-wrap:balance}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 .6rem}
.lede{max-width:60ch;color:var(--ink-2);margin:.8rem 0 0}

/* ladder */
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ladder li{font-family:var(--display);font-weight:900;font-size:1.5rem;text-align:center;padding:.45rem 0;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);background:transparent}
.ladder li.past{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:2px}
.ladder li.cur{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.ladder.big{margin:1.6rem 0 0;max-width:520px}
.ladder.big li{font-size:2rem;padding:.6rem 0;color:var(--ink)}
.ladder.big li:nth-child(n){opacity:1}

/* setup */
.setup{padding-top:2vh}
.plist{display:grid;gap:10px;margin:2rem 0 0;padding:0;list-style:none;max-width:520px}
.plist li{display:flex;gap:8px}
.plist input{flex:1;min-width:0;padding:.7rem .85rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.plist input::placeholder{color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.4rem}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.7rem 1.1rem;border-radius:6px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:.45rem .8rem;font-size:.9rem}

/* board */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(2.2rem,7vw,3.4rem)}
.players{list-style:none;margin:1.2rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.player{display:flex;align-items:baseline;gap:.7rem;padding:.5rem .9rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.player .pn{font-weight:600;overflow-wrap:anywhere}
.player .ps{font-weight:900;font-size:1.7rem}
.player .turn{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.player.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.status{margin:1rem 0 .4rem;color:var(--ink-2)}
.status strong{color:var(--ink)}
.board{margin-top:.6rem}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(5,minmax(0,1fr));gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.cat{font-weight:900;font-size:1.45rem;overflow-wrap:anywhere}
.cat small{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;letter-spacing:.04em;text-transform:none;color:var(--ink-2);margin-top:.25rem}
.tile{height:54px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--display);font-weight:900;font-size:1.7rem;cursor:pointer;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tile.done{background:var(--gold);border-color:var(--gold);color:var(--on-gold);cursor:default}
.tile.done.zero{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.tile.empty{border-style:dashed;background:transparent;color:var(--ink-2);cursor:default;opacity:.7}
.final{margin:1rem 0 0;padding:1rem 1.2rem;border:2px solid var(--gold);border-radius:6px;background:var(--surface)}
.final h2{margin:0 0 .3rem}
.foot{margin-top:1.4rem;font-size:.85rem;color:var(--ink-2)}

/* question */
.qwrap{max-width:720px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;color:var(--ink-2);font-weight:600}
.qhead strong{color:var(--ink)}
.worth{display:flex;align-items:flex-end;gap:.5rem;margin:1rem 0 .9rem}
.worth .pts{font-weight:900;font-size:clamp(4.5rem,22vw,7.5rem);color:var(--ink)}
.worth .unit{font-family:var(--display);font-weight:900;font-size:2rem;padding-bottom:.9rem;color:var(--ink-2)}
.hints{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;gap:8px}
.hint{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.9rem;align-items:baseline;padding:.8rem 1rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.hint .pts{font-weight:900;font-size:1.5rem;color:var(--ink-2)}
.hint p{margin:0;overflow-wrap:anywhere}
.hint.new{border:2px solid var(--accent);padding:calc(.8rem - 1px) calc(1rem - 1px)}
.hint.new .pts{color:var(--accent)}
.hint.new p{font-size:1.15rem;font-weight:500}
.hint.rest{background:transparent;border-style:dashed;color:var(--ink-2)}
.skip{margin-top:10px}
.result{margin-top:1.4rem;padding:1.2rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.result.solved{border:2px solid var(--good)}
.result.failed{border-style:dashed}
.result .kicker.ok{color:var(--good)}
.result p{margin:.2rem 0 1rem}

@media (max-width:620px){
  .row{grid-template-columns:repeat(5,minmax(0,1fr))}
  .cat{grid-column:1/-1}
  .tile{height:50px}
  .hint{grid-template-columns:3.4rem minmax(0,1fr);gap:.6rem}
}
</style>
</head>

  var PER_CAT=5;
  var TOTAL=CATS.reduce(function(n,c){return n+c.q.length;},0);

  var S={screen:'setup',names:['',''],players:[],cur:0,done:{},active:null,confirmNew:false};
  var app=document.getElementById('app');

  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(!r)return;
      var d=JSON.parse(r);
      if(d&&d.players&&d.players.length){S.screen='board';S.players=d.players;S.cur=d.cur||0;S.done=d.done||{};}
    }catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify({players:S.players,cur:S.cur,done:S.done}));}catch(e){}}
  function wipe(){try{localStorage.removeItem(KEY);}catch(e){}}

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function ladderHtml(a,cls){
    return '<ol class="ladder'+(cls?' '+cls:'')+'" aria-label="Body za nápovedu">'+LADDER.map(function(v,i){
      var c='';
      if(a){c=(a.status==='failed'||i<a.hint)?'past':(i===a.hint?'cur':'');}
      return '<li class="'+c+'">'+v+'</li>';
    }).join('')+'</ol>';
  }

  /* ---------- views ---------- */
  function setupView(){
    var rows=S.names.map(function(n,i){
      return '<li><label class="sr" for="p'+i+'">Meno hráča '+(i+1)+'</label>'+
        '<input id="p'+i+'" data-i="'+i+'" type="text" maxlength="20" placeholder="Hráč '+(i+1)+'" value="'+esc(n)+'" autocomplete="off">'+
        (S.names.length>1?'<button type="button" class="btn small" data-act="rm" data-i="'+i+'" aria-label="Odstrániť hráča '+(i+1)+'">Odstrániť</button>':'')+
        '</li>';
    }).join('');
    return '<main class="setup">'+
      '<p class="kicker">Kvíz pre 1 až 4 hráčov</p>'+
      '<h1>Päť nápovedí</h1>'+
      '<p class="lede">Vyber si tému a hádajte, čo sa skrýva za nápovedami. Prvá je najťažšia a stojí 100 bodov. Pri každej ďalšej je odpoveď ľahšia a o 20 bodov lacnejšia. Kto tipne nesprávne, na tej otázke končí bez bodov. Hru ovláda moderátor.</p>'+
      ladderHtml(null,'big')+
      '<ul class="plist">'+rows+'</ul>'+
      '<div class="actions">'+
        (S.names.length<4?'<button type="button" class="btn" data-act="add" id="addBtn">Pridať hráča</button>':'')+
        '<button type="button" class="btn primary" data-act="start" id="startBtn">Začať hru</button>'+
      '</div>'+
    '</main>';
  }

  function tileHtml(c,i){
    var k=c.id+'-'+i,q=c.q[i];
    if(k in S.done){
      var v=S.done[k];
      return '<button class="tile done'+(v?'':' zero')+'" disabled aria-label="'+esc(c.name)+', otázka '+(i+1)+', získané body: '+v+'">'+v+'</button>';
    }
    if(!q)return '<button class="tile empty" disabled aria-label="'+esc(c.name)+', otázka '+(i+1)+' ešte nie je pripravená">–</button>';
    return '<button class="tile" data-act="open" data-cat="'+c.id+'" data-idx="'+i+'" aria-label="'+esc(c.name)+', otázka '+(i+1)+'">'+(i+1)+'</button>';
  }

  function boardView(){
    var doneCount=Object.keys(S.done).length;
    var finished=doneCount>=TOTAL;
    var players=S.players.map(function(p,i){
      var on=(i===S.cur&&!finished);
      return '<li class="player'+(on?' on':'')+'"><span class="pn">'+esc(p.name)+'</span><span class="ps">'+p.score+'</span>'+(on&&S.players.length>1?'<span class="turn">na ťahu</span>':'')+'</li>';
    }).join('');
    var rows=CATS.map(function(c){
      var left=c.q.filter(function(_,i){return !((c.id+'-'+i) in S.done);}).length;
      var tiles='';
      for(var i=0;i<PER_CAT;i++)tiles+=tileHtml(c,i);
      return '<div class="row"><div class="cat">'+esc(c.name)+'<small>'+'zostáva '+left+' z '+c.q.length+'</small></div>'+tiles+'</div>';
    }).join('');
    var best=Math.max.apply(null,S.players.map(function(p){return p.score;}));
    var winners=S.players.filter(function(p){return p.score===best;}).map(function(p){return esc(p.name);});
    var end=finished?
      '<section class="final"><h2>Koniec hry</h2><p>'+(S.players.length>1?(winners.length>1?'Remíza: '+winners.join(', ')+' ('+best+' b).':'Víťaz: '+winners[0]+' ('+best+' b).'):'Získané body: '+best+'.')+'</p><button class="btn primary" data-act="newgame">Hrať znova</button></section>':'';
    var status=finished?'':'<p class="status">'+(S.players.length>1?'Na ťahu je <strong>'+esc(S.players[S.cur].name)+'</strong>. ':'')+'Vyber si tému a číslo otázky.</p>';
    return '<main>'+
      '<div class="top"><h1>Päť nápovedí</h1>'+
      '<button class="btn small" data-act="newgame">'+(S.confirmNew?'Naozaj? Klikni znova':'Nová hra')+'</button></div>'+
      '<ul class="players" aria-label="Skóre">'+players+'</ul>'+
      end+status+
      '<div class="board" role="group" aria-label="Tabuľa otázok">'+rows+'</div>'+
    '</main>';
  }

  function questionView(){
    var a=S.active,c=CATS.filter(function(x){return x.id===a.cat;})[0],q=c.q[a.idx],pl=S.players[S.cur];
    var over=a.status!=='playing';
    var shown=over?5:a.hint+1;
    var hints='';
    for(var i=0;i<shown;i++){
      var cls=(!over&&i===a.hint)?'new':(over&&i>a.hint?'rest':'');
      if(a.status==='failed')cls='';
      hints+='<li class="hint '+cls+'"><span class="pts">'+LADDER[i]+' b</span><p>'+esc(q.hints[i])+'</p></li>';
    }
    var body;
    if(!over&&!a.revealed){
      var last=a.hint>=4;
      body=
        '<div class="actions">'+
          '<button type="button" class="btn primary" id="revealBtn" data-act="reveal">Odkryť správnu odpoveď</button>'+
          '<button type="button" class="btn ghost" data-act="skip">'+(last?'Nikto nevie, ukončiť otázku':'Neviem, ďalšia nápoveda ('+LADDER[a.hint+1]+' b)')+'</button>'+
        '</div>';
    }else if(!over){
      body=
        '<section class="result">'+
          '<p class="kicker">Správna odpoveď</p>'+
          '<h2>'+esc(q.answer)+'</h2>'+
          '<p>Uhádol '+esc(pl.name)+'?</p>'+
          '<div class="actions">'+
            '<button type="button" class="btn primary" data-act="right">Správne (+'+LADDER[a.hint]+' b)</button>'+
            '<button type="button" class="btn" data-act="wrong">Nesprávne (0 b)</button>'+
          '</div>'+
        '</section>';
    }else{
      var ok=a.status==='solved';
      body=
        '<section class="result '+a.status+'">'+
          '<p class="kicker'+(ok?' ok':'')+'">'+(ok?'Správne':'Bez bodov')+'</p>'+
          '<h2>'+esc(q.answer)+'</h2>'+
          '<p>'+(ok?esc(pl.name)+' získava '+LADDER[a.hint]+' b.':esc(pl.name)+' tentoraz nezískava žiadne body.')+'</p>'+
          '<button class="btn primary" data-act="back" id="backBtn">Späť na tabuľu</button>'+
        '</section>';
    }
    var worth=over?(a.status==='solved'?LADDER[a.hint]:0):LADDER[a.hint];
    return '<main class="qwrap">'+
      '<div class="qhead"><span>'+esc(c.name)+' · otázka '+(a.idx+1)+'</span><span>Hrá: <strong>'+esc(pl.name)+'</strong></span></div>'+
      '<div class="worth"><span class="pts" aria-label="'+worth+' bodov">'+worth+'</span><span class="unit">b</span></div>'+
      ladderHtml(a)+
      '<ol class="hints" aria-label="Nápovedy">'+hints+'</ol>'+
      body+
    '</main>';
  }

  function render(){
    app.innerHTML=S.screen==='setup'?setupView():(S.active?questionView():boardView());
    window.scrollTo(0,0);
    var el=null;
    if(S.active){el=document.getElementById(S.active.status!=='playing'?'backBtn':(S.active.revealed?null:'revealBtn'));}
    if(el){try{el.focus({preventScroll:true});}catch(e){}}
  }

  /* ---------- game logic ---------- */
  function resolve(status){
    var a=S.active,key=a.cat+'-'+a.idx;
    a.status=status;
    var pts=status==='solved'?LADDER[a.hint]:0;
    S.done[key]=pts;
    S.players[S.cur].score+=pts;
    save();
  }
  function nextHint(){
    var a=S.active;
    if(a.hint<4){a.hint++;}
    else{resolve('failed');}
  }

  app.addEventListener('input',function(e){
    var i=e.target.getAttribute&&e.target.getAttribute('data-i');
    if(i!==null&&e.target.tagName==='INPUT'){S.names[+i]=e.target.value;}
  });

  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');
    if(!b)return;
    var act=b.getAttribute('data-act');
    if(act!=='newgame')S.confirmNew=false;
    if(act==='add'){
      if(S.names.length<4){S.names.push('');render();var el=document.getElementById('p'+(S.names.length-1));if(el)el.focus();}
    }else if(act==='rm'){
      S.names.splice(+b.getAttribute('data-i'),1);render();
    }else if(act==='start'){
      S.players=S.names.map(function(n,i){return {name:(n.trim()||('Hráč '+(i+1))),score:0};});
      S.cur=0;S.done={};S.active=null;S.screen='board';save();render();
    }else if(act==='open'){
      S.active={cat:b.getAttribute('data-cat'),idx:+b.getAttribute('data-idx'),hint:0,status:'playing',revealed:false};
      render();
    }else if(act==='skip'){
      nextHint();
      render();
    }else if(act==='reveal'){
      S.active.revealed=true;render();
    }else if(act==='right'){
      resolve('solved');render();
    }else if(act==='wrong'){
      resolve('failed');render();
    }else if(act==='back'){
      S.active=null;S.cur=(S.cur+1)%S.players.length;save();render();
    }else if(act==='newgame'){
      var finished=Object.keys(S.done).length>=TOTAL;
      if(S.confirmNew||finished){
        wipe();S.screen='setup';S.names=S.players.map(function(p){return p.name;});S.players=[];S.done={};S.cur=0;S.active=null;S.confirmNew=false;render();
      }else{S.confirmNew=true;render();}
    }
  });

  load();
  render();
})();
</script>

</body>
</html>
